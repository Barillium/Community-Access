name: community_access_client
description: Erhaltene Flutter-Gastoberfläche für die geplante Better-Auth-Umstellung.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.13.4
dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-Regular.ttf
        - asset: assets/fonts/Rubik-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rubik-Bold.ttf
          weight: 700
